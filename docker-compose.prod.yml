services:
  omega-bot:
    # Pull pre-built image from Docker Hub
    image: lutogin/sigma-trading-bot:latest
    container_name: sigma-trading-bot

    # Always restart unless explicitly stopped
    restart: unless-stopped

    # Load environment variables from .env file
    env_file:
      - .env

    # Set production environment
    environment:
      PYTHONUNBUFFERED: 1 # Real-time logging
      PYTHONDONTWRITEBYTECODE: 1 # Don't create .pyc files
      TZ: UTC

    # Mount volumes
    volumes:
      # Logs directory - for application logs
      - ./logs:/app/logs

    # Resource limits for DigitalOcean 2vCPU/2GB droplet
    deploy:
      resources:
        limits:
          cpus: '2.0' # Max 2 vCPU (для ThreadPool + warmup)
          memory: 3.7G # Max 3.7GB (запас 300MB для системы)
        reservations:
          cpus: '1.0' # Min 1 vCPU
          memory: 1.6G # Min 1.6G RAM

    # Logging configuration - important for production
    logging:
      driver: 'json-file'
      options:
        max-size: '20m' # Maximum log file size before rotation
        max-file: '3' # Keep 3 rotated log files
        compress: 'true' # Compress rotated logs
    # The image healthcheck validates PID 1 and the latest successful scan marker.

  pair-refresh:
    image: lutogin/sigma-trading-bot:latest
    profiles:
      - maintenance
    restart: 'no'
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      TZ: UTC
    volumes:
      - ./logs:/app/logs
      # The named volume keeps the lock and audit JSON across one-shot runs.
      - pair-refresh-results:/app/backtests/results
    command:
      - python
      - scripts/refresh_trading_pairs.py
      - --activate
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3.7G
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'
        compress: 'true'

volumes:
  pair-refresh-results:
