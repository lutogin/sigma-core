name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger

env:
  DOCKER_IMAGE: lutogin/sigma-trading-bot
  CONTAINER_NAME: sigma-trading-bot

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q main.py src backtests scripts tests

      - name: Run tests
        run: python -m pytest -q tests

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  deploy:
    name: Deploy to Digital Ocean
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Digital Ocean via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.APP_PATH }}

            # Keep a local rollback tag until the new image passes its healthcheck.
            if docker inspect ${{ env.CONTAINER_NAME }} >/dev/null 2>&1; then
              previous_image=$(docker inspect --format '{{.Image}}' ${{ env.CONTAINER_NAME }})
              docker image tag "$previous_image" ${{ env.DOCKER_IMAGE }}:rollback
            fi

            # Deploy the exact digest built by this workflow, not a mutable tag.
            docker pull ${{ env.DOCKER_IMAGE }}@${{ needs.build-and-push.outputs.digest }}
            docker image tag \
              ${{ env.DOCKER_IMAGE }}@${{ needs.build-and-push.outputs.digest }} \
              ${{ env.DOCKER_IMAGE }}:latest

            # Recreate only the bot service; its databases are not part of this compose file.
            docker compose up -d --remove-orphans --force-recreate

            # Show logs for verification
            echo "=== Container Status ==="
            docker ps --filter name=${{ env.CONTAINER_NAME }}

            echo "=== Recent Logs ==="
            docker compose logs --tail=50

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.APP_PATH }}

            # A successful process start is insufficient: wait for a completed scan.
            for attempt in $(seq 1 60); do
              health=$(docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                ${{ env.CONTAINER_NAME }} 2>/dev/null || echo missing)
              if [ "$health" = "healthy" ]; then
                echo "Deployment successful: scanner is healthy."
                docker image rm ${{ env.DOCKER_IMAGE }}:rollback >/dev/null 2>&1 || true
                docker image prune -af --filter "until=24h"
                exit 0
              fi
              if [ "$health" = "unhealthy" ] || [ "$health" = "missing" ]; then
                break
              fi
              sleep 10
            done

            echo "Deployment failed health verification; restoring previous image."
            docker compose logs --tail=100
            if docker image inspect ${{ env.DOCKER_IMAGE }}:rollback >/dev/null 2>&1; then
              docker image tag \
                ${{ env.DOCKER_IMAGE }}:rollback \
                ${{ env.DOCKER_IMAGE }}:latest
              docker compose up -d --force-recreate
              echo "Previous image restored."
            else
              echo "No rollback image was available."
            fi
            exit 1

  notify:
    name: Notify Deployment Status
    needs: [test, build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send Telegram notification
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 **Sigma Trading Bot Deployment**

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}

            Test: ${{ needs.test.result }}
            Build: ${{ needs.build-and-push.result }}
            Deploy: ${{ needs.deploy.result }}

            Status: ${{ job.status }}
